name: hfa_app
description: "HFA Swimming Academy App"
publish_to: 'none'
version: 1.0.3+7

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.8.1
  dio: ^5.7.0
  shared_preferences: ^2.3.4
  intl: ^0.20.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1
  image_picker: ^1.2.2
  url_launcher: ^6.3.1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  webview_flutter: ^4.13.1
  web: ^1.1.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  image_path_ios: "assets/icons/app_icon_ios.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_android_fg.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
